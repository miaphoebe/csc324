{{ define "main" }}
  <article class="article-page">
    <header class="article-page__header">
      {{ with .Parent }}<p class="eyebrow">{{ .Title }}</p>{{ end }}
      <h1 class="page-title">{{ .Title }}</h1>
      {{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
      {{ $dateHuman := .Date | time.Format ":date_long" }}
      <time class="article-page__date" datetime="{{ $dateMachine }}"
        >{{ $dateHuman }}</time
      >
    </header>

    <div class="article-page__content prose">
      {{ .Content }}
    </div>

    {{ with .Parent }}
      <p class="back-link"><a href="{{ .RelPermalink }}">&larr; All {{ .Title }}</a></p>
    {{ end }}
  </article>
{{ end }}
